[project]
name = "pickleball-analyzer"
version = "0.1.0"
description = "Upload a pickleball video, tag rally shots and points with timestamps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "opencv-python-headless",
    "static-ffmpeg",   # ffmpeg/ffprobe binaries stored inside .venv, no Homebrew install
]

[tool.uv]
package = false

[dependency-groups]
demo = [
    "playwright>=1.64.1",
]
